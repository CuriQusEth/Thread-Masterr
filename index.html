    <script>
      (function() {
        try {
          var origDefProp = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return origDefProp.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (err && (String(err.message || '').indexOf('Cannot redefine property') !== -1 || String(prop).indexOf('is') === 0)) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
              throw err;
            }
          };

          window.addEventListener('error', function(event) {
            if (event.message && (event.message.indexOf('Cannot redefine property') !== -1 || event.message.indexOf('isZerion') !== -1)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        } catch (_) {}
      })();
    </script>
